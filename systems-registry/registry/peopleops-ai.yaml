state_owned:
- project-local SQLite application database and analytics snapshot
- generated demo identities, ingestion lineage, quarantine, audit, and notification state
- isolated PostgreSQL training volume, synthetic fixtures, and local evaluation reports
- separate policy PostgreSQL and n8n volumes, immutable documents, embeddings, and ingestion audit
- isolated enterprise SQLite index, redacted audit, principal-bound receipts, fixture data and reproducible release evidence
- pinned public IBM CSV, expiring identity-bound conversations and reports, optional synthetic provided survey aggregates
tests:
  unit:
  - uv run pytest
  - uv run --project training pytest training/tests/foundation
  - cd policy_assistant && uv run pytest
  - policy_assistant/.venv/bin/python -m pytest survey_analytics/tests
  - cd people-insights-ai && .venv/bin/python -m pytest -q
  smoke:
  - uv run peopleops quality
  - cd policy_assistant && uv run python scripts/smoke.py
  - cd policy_assistant && uv run python -m ingestion.run_pipeline
  - policy_assistant/.venv/bin/python -m survey_analytics.smoke
  - policy_assistant/.venv/bin/python -m survey_analytics.cohort_smoke
  - cd people-insights-ai && .venv/bin/python scripts/smoke.py
  contract:
  - uv run peopleops dbt
  integration:
  - uv run peopleops evaluate
  - cd policy_assistant && uv run python -m evals.run_evaluations
