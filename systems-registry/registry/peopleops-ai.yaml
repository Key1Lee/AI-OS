name: peopleops-ai
purpose: Fictional local HR engineering application and interview learning lab.
owns:
- project-local employee ingestion, validation, metrics, and HR request workflows
- permission-filtered policy retrieval and local mock notifications
- isolated demo data, credentials, curriculum, tests, and operational evidence
- Python 3.12 training infrastructure and isolated learner-owned business exercises
- completed fictional policy assistant with versioned Markdown, pgvector ACL retrieval, and local n8n chat
- standalone SQLite enterprise mock with signed Slack, scoped synthetic PTO, governed RAG, traceability, evaluations and CI gates
- interactive engineering dashboard with measured stages, executable rule inspectors, isolated failure simulation and permission-gated test subprocesses
- synthetic Qualtrics survey collection with local n8n, versioned Bronze/Silver/Gold and a 5,000-person department visualization
- standalone IBM synthetic employee-experience chatbot with pandas metrics, bounded sessions, scoped aggregate exports and optional n8n relay
does_not_own:
- real enterprise integrations, real employee data, or production deployment
- shared provider runtime, sibling engine state, or canonical learner mastery
