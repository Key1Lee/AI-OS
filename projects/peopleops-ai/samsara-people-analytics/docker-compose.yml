name: samsara-people-demo
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/samsara-survey
      QWEN_BASE_URL: http://host.docker.internal:8080/v1
      QWEN_MODEL: Qwen3-4B-Q4_K_M
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/report').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
  n8n:
    image: n8nio/n8n:2.43.7
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Asia/Seoul
      N8N_DEFAULT_LOCALE: en
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/demo:ro
    entrypoint: ["/bin/sh", "/demo/start.sh"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 18
volumes:
  n8n-data:
