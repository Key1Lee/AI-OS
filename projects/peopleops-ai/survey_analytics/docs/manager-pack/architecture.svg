<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Local n8n survey architecture</title><desc id="desc">n8n orchestrates collection, Bronze, Silver, Gold, visualization and dashboard; errors go to a local inbox.</desc><rect width="1200" height="760" fill="white"/><rect x="25" y="20" width="1150" height="112" rx="12" fill="#173f35" stroke="#d6dfd9" stroke-width="2"/><text x="48" y="67" font-family="Arial,sans-serif" font-size="30" fill="#ffffff">n8n orchestrates the sequence</text><text x="48" y="103" font-family="Arial,sans-serif" font-size="23" fill="#d5e5dc">Start in n8n or the dashboard. FastAPI performs the data work; SQLite stores it.</text><rect x="25" y="185" width="350" height="166" rx="12" fill="#f0f5ef" stroke="#d6dfd9" stroke-width="2"/><text x="45" y="235" font-family="Arial,sans-serif" font-size="28" fill="#243f35">01  Mock Qualtrics</text><text x="45" y="283" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Public fake token</text><text x="45" y="316" font-family="Arial,sans-serif" font-size="23" fill="#243f35">5,000 unique responses</text><rect x="425" y="185" width="350" height="166" rx="12" fill="#f0f5ef" stroke="#d6dfd9" stroke-width="2"/><text x="445" y="235" font-family="Arial,sans-serif" font-size="28" fill="#243f35">02  Bronze</text><text x="445" y="283" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Preserve the raw export</text><text x="445" y="316" font-family="Arial,sans-serif" font-size="23" fill="#243f35">5,000 raw versions</text><rect x="825" y="185" width="350" height="166" rx="12" fill="#f0f5ef" stroke="#d6dfd9" stroke-width="2"/><text x="845" y="235" font-family="Arial,sans-serif" font-size="28" fill="#243f35">03  Silver</text><text x="845" y="283" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Validate and deduplicate</text><text x="845" y="316" font-family="Arial,sans-serif" font-size="23" fill="#243f35">5,000 accepted responses</text><rect x="825" y="420" width="350" height="166" rx="12" fill="#f0f5ef" stroke="#d6dfd9" stroke-width="2"/><text x="845" y="470" font-family="Arial,sans-serif" font-size="28" fill="#243f35">04  Gold</text><text x="845" y="518" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Calculate explicit metrics</text><text x="845" y="551" font-family="Arial,sans-serif" font-size="23" fill="#243f35">10 department aggregates</text><rect x="425" y="420" width="350" height="166" rx="12" fill="#f0f5ef" stroke="#d6dfd9" stroke-width="2"/><text x="445" y="470" font-family="Arial,sans-serif" font-size="28" fill="#243f35">05  Visualization</text><text x="445" y="518" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Build reports from Gold</text><text x="445" y="551" font-family="Arial,sans-serif" font-size="23" fill="#243f35">HTML and CSV exports</text><rect x="25" y="420" width="350" height="166" rx="12" fill="#f0f5ef" stroke="#d6dfd9" stroke-width="2"/><text x="45" y="470" font-family="Arial,sans-serif" font-size="28" fill="#243f35">06  Dashboard</text><text x="45" y="518" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Filter and compare scores</text><text x="45" y="551" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Show each sample size</text><polyline points="375,267 421,267" fill="none" stroke="#759587" stroke-width="4"/><polygon points="421,267 411,260 411,274" fill="#759587"/><polyline points="775,267 821,267" fill="none" stroke="#759587" stroke-width="4"/><polygon points="821,267 811,260 811,274" fill="#759587"/><polyline points="1000,351 1000,416" fill="none" stroke="#759587" stroke-width="4"/><polygon points="1000,416 993,406 1007,406" fill="#759587"/><polyline points="825,503 779,503" fill="none" stroke="#759587" stroke-width="4"/><polygon points="779,503 789,496 789,510" fill="#759587"/><polyline points="425,503 379,503" fill="none" stroke="#759587" stroke-width="4"/><polygon points="379,503 389,496 389,510" fill="#759587"/><text x="25" y="634" font-family="Arial,sans-serif" font-size="23" fill="#243f35">Bronze, Silver and Gold persist in local SQLite under the same source batch hash.</text><rect x="25" y="660" width="1150" height="75" rx="12" fill="#fff5e9" stroke="#e6cdae" stroke-width="2"/><text x="45" y="706" font-family="Arial,sans-serif" font-size="23" fill="#785232">If a stage fails: stop that run &gt; published error workflow &gt; local notification inbox</text></svg>