name: Enterprise HR mock checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Static checks
        run: uv run python scripts/static_check.py
      - name: Unit, integration, security and signed Slack end-to-end tests
        run: uv run pytest --junitxml=reports/tests.xml
      - name: Deterministic AI evaluations, traceability and release gates
        run: uv run python -m evals.run_evaluations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-hr-evidence
          path: reports/
