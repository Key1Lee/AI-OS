[project]
name = "peopleops-training"
version = "0.2.0"
description = "Synthetic enterprise AI infrastructure and isolated interview exercises"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "httpx>=0.28,<1", "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab", "exercises"]

[tool.pytest.ini_options]
testpaths = ["tests/foundation"]
pythonpath = ["."]
addopts = "-q"
markers = ["database: requires the isolated PostgreSQL database"]
