[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-contracts-system"
version = "0.1.0"
description = "A deterministic visual data quality and contracts learning system"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
dbt = ["dbt-core>=1.10.5,<2", "dbt-duckdb>=1.9,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quality_system = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
