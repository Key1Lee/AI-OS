[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-observability-system"
version = "0.1.0"
description = "Reusable deterministic data-system metadata and observability engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "duckdb>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_system_map = ["demo/commerce/*.json", "demo/commerce/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

