[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forward-deployment-engineering-lab"
version = "0.1.0"
description = "An evidence-gated, local FDE learning simulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fde = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools.package-data]
lab = ["scenarios/*.json"]
